name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            platform: macos-14
            target: aarch64-apple-darwin
            goarch: arm64
          - label: macOS x64
            platform: macos-14
            target: x86_64-apple-darwin
            goarch: amd64

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: vendor/mole/go.sum
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:ui

      # Build Mole's status/analyze for the same architecture the bundle targets.
      - name: Stage the pinned Mole engine
        run: bash scripts/sync-engine.sh ${{ matrix.goarch }}

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: set these to ship a signed, notarised build.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: v__VERSION__
          releaseName: Burrow v__VERSION__
          releaseBody: |
            内置 Mole 引擎的 macOS 清理工作台。详细变更见 CHANGELOG.md。

            - 首次打开未签名构建时，请右键 →「打开」，或在系统设置 → 隐私与安全性中放行。
            - 需要 sudo 的系统缓存不会在图形界面中执行，可用「在终端中运行完整清理」。
          releaseDraft: ${{ github.event_name == 'workflow_dispatch' }}
          prerelease: false
          args: --target ${{ matrix.target }} --bundles app,dmg
