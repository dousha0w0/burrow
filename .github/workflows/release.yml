name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            platform: macos-14
            target: aarch64-apple-darwin
            goarch: arm64
          - label: macOS x64
            platform: macos-14
            target: x86_64-apple-darwin
            goarch: amd64

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: vendor/mole/go.sum
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:ui

      # Build Mole's status/analyze for the same architecture the bundle targets.
      - name: Stage the pinned Mole engine
        run: bash scripts/sync-engine.sh ${{ matrix.goarch }}

      # An empty APPLE_CERTIFICATE makes Tauri try to import a blank p12 and
      # fail the bundle, so only export the vars that actually hold a secret.
      - name: Export signing secrets when configured
        env:
          SIGN_CERT: ${{ secrets.APPLE_CERTIFICATE }}
          SIGN_CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SIGN_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          NOTARY_ID: ${{ secrets.APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          NOTARY_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          add() {
            [[ -n "${2:-}" ]] || return 0
            { echo "$1<<__BURROW_SECRET__"; echo "$2"; echo "__BURROW_SECRET__"; } >> "$GITHUB_ENV"
          }
          add APPLE_CERTIFICATE "$SIGN_CERT"
          add APPLE_CERTIFICATE_PASSWORD "$SIGN_CERT_PASSWORD"
          add APPLE_SIGNING_IDENTITY "$SIGN_IDENTITY"
          add APPLE_ID "$NOTARY_ID"
          add APPLE_PASSWORD "$NOTARY_PASSWORD"
          add APPLE_TEAM_ID "$NOTARY_TEAM"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Burrow v__VERSION__
          releaseBody: |
            内置 Mole 引擎的 macOS 清理工作台。详细变更见 CHANGELOG.md。

            - 首次打开未签名构建时，请右键 →「打开」，或在系统设置 → 隐私与安全性中放行。
            - 需要 sudo 的系统缓存不会在图形界面中执行，可用「在终端中运行完整清理」。
          releaseDraft: ${{ github.event_name == 'workflow_dispatch' }}
          prerelease: false
          args: --target ${{ matrix.target }} --bundles app,dmg
